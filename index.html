<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>William Zhang · AI GTM Lead at GitHub</title>
  <meta name="description" content="William Zhang helps enterprises connect AI strategy, implementation, and sustained adoption through GitHub Copilot, developer experience, and enablement.">
  <meta property="og:title" content="William Zhang · AI GTM Lead at GitHub">
  <meta property="og:description" content="Enterprise AI adoption, GitHub Copilot, developer experience, and technical enablement in Japan.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://moulongzhang.github.io">
  <meta property="og:image" content="https://moulongzhang.github.io/assets/william-zhang.jpg">
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
    }

    body::before {
      position: fixed;
      width: min(34rem, 70vw);
      height: min(34rem, 70vw);
      right: -12rem;
      bottom: -14rem;
      z-index: -1;
      border: 1px solid var(--cp-border);
      border-radius: 50%;
      background: var(--cp-accent-soft);
      content: "";
    }

    a:focus-visible {
      outline: 3px solid var(--cp-accent);
      outline-offset: 4px;
    }

    main {
      display: grid;
      width: min(70rem, calc(100% - 2rem));
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(2rem, 6vh, 4rem) 0;
      place-items: center;
    }

    .hero {
      display: grid;
      width: 100%;
      grid-template-columns: minmax(0, 1.25fr) minmax(17rem, 0.75fr);
      align-items: center;
      gap: clamp(2.5rem, 8vw, 6rem);
    }

    .name {
      margin: 0 0 0.25rem;
      color: var(--cp-text);
      font-size: clamp(1.2rem, 2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .role {
      margin: 0 0 1.75rem;
      color: var(--cp-accent);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 0 0 1.5rem;
      font-size: clamp(3rem, 7.5vw, 6rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    .intro {
      max-width: 42rem;
      margin: 0 0 2rem;
      color: var(--cp-text-soft);
      font-size: clamp(1.08rem, 2vw, 1.32rem);
      line-height: 1.55;
    }

    .social {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .social a {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1rem;
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.625rem;
      color: var(--cp-text);
      font-weight: 700;
      text-decoration: none;
    }

    .social a:hover {
      border-color: var(--cp-accent);
      color: var(--cp-accent);
    }

    .social .primary {
      border-color: var(--cp-accent);
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
    }

    .social .primary:hover {
      border-color: var(--cp-accent-hover);
      background: var(--cp-accent-hover);
      color: var(--cp-accent-fg);
    }

    .portrait-wrap {
      position: relative;
      width: 100%;
      max-width: 24rem;
      justify-self: end;
    }

    .portrait-wrap::before {
      position: absolute;
      inset: 1rem -1rem -1rem 1rem;
      z-index: -1;
      border: 1px solid var(--cp-border-strong);
      border-radius: 16px;
      content: "";
    }

    .portrait {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      object-fit: cover;
    }

    @media (max-width: 48rem) {
      main {
        align-items: start;
        padding: 2rem 0 3rem;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }

      .portrait-wrap {
        order: -1;
        width: min(17rem, calc(100% - 1rem));
        justify-self: start;
      }

      h1 {
        font-size: clamp(3rem, 14vw, 4.5rem);
      }
    }

    @media (max-width: 30rem) {
      main {
        width: min(100% - 1.5rem, 70rem);
        padding-top: 1.25rem;
      }

      .portrait-wrap {
        width: min(13rem, calc(100% - 1rem));
      }

      .hero {
        gap: 2rem;
      }

      .role {
        margin-bottom: 1.25rem;
      }

      h1 {
        margin-bottom: 1rem;
      }

      .intro {
        margin-bottom: 1.5rem;
      }
    }

    @media (max-height: 45rem) and (min-width: 48.01rem) {
      main {
        padding: 1.5rem 0;
      }

      .portrait-wrap {
        max-width: 19rem;
      }

      h1 {
        font-size: clamp(3rem, 8vh, 4.5rem);
      }

      .role {
        margin-bottom: 1rem;
      }

      .intro {
        margin-bottom: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div>
        <p class="name">William Zhang</p>
        <p class="role">AI GTM Lead at GitHub</p>
        <h1 id="hero-title">Enterprise AI, built to last.</h1>
        <p class="intro">
          I help enterprises connect AI strategy, implementation, and sustained
          adoption through GitHub Copilot, better developer experience, and
          practical technical enablement.
        </p>
        <div class="social" role="group" aria-label="Social profiles">
          <a class="primary" href="https://www.linkedin.com/in/moulongzhang" target="_blank" rel="noreferrer">LinkedIn</a>
          <a href="https://x.com/moulongzhang" target="_blank" rel="noreferrer">X</a>
          <a href="https://github.com/moulongzhang" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>
      <div class="portrait-wrap">
        <img class="portrait" src="assets/william-zhang.jpg" width="720" height="720" alt="William Zhang speaking at a technology event">
      </div>
    </section>
  </main>
</body>
</html>
